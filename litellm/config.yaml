model_list:
  - model_name: claude-opus-5
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
      api_key: os.environ/NVIDIA_API_KEY_1
    order: 1
    rpm: 40

  - model_name: claude-opus-5
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
      api_key: os.environ/NVIDIA_API_KEY_2
    order: 2
    rpm: 40

  - model_name: claude-sonnet-5
    litellm_params:
      model: openai/agnes-2.5-flash
      api_base: https://apihub.agnes-ai.com/v1
      api_key: os.environ/AGNES_API_KEY
      use_chat_completions_api: true
    order: 1

  - model_name: claude-sonnet-5
    litellm_params:
      model: openai/sensenova-6.8-flash-lite
      api_base: https://token.sensenova.ai/v1
      api_key: os.environ/AGNES_API_KEY
      use_chat_completions_api: true
    order: 2

  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY_1
      additional_drop_params: ["tools[*].strict"]
    rpm: 15
    tpm: 250000

  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY_2
      additional_drop_params: ["tools[*].strict"]
    rpm: 15
    tpm: 250000

  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY_1
      additional_drop_params: ["tools[*].strict"]
    rpm: 15
    tpm: 250000

  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY_2
      additional_drop_params: ["tools[*].strict"]
    rpm: 15
    tpm: 250000

litellm_settings:
  drop_params: true
  use_chat_completions_url_for_anthropic_messages: true
  request_timeout: 180

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2 # Retry twice before tripping fallback
  cooldown_time: 60 # Shorter cooldown for transient errors

fallbacks:
  - claude-opus-5: ["claude-sonnet-5", "claude-haiku-4-5-20251001"]
  - claude-sonnet-5: ["claude-opus-5", "claude-haiku-4-5-20251001"]
  - claude-haiku-4-5-20251001: ["claude-opus-5", "claude-sonnet-5"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
