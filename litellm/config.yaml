model_list:
  - model_name: claude-opus-4-8
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
      api_key: os.environ/NVIDIA_API_KEY_1
    model_info:
      input_cost_per_token: 0.0000005
      output_cost_per_token: 0.0000022

  - model_name: claude-opus-4-8
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
      api_key: os.environ/NVIDIA_API_KEY_2
    model_info:
      input_cost_per_token: 0.0000005
      output_cost_per_token: 0.0000022

  - model_name: claude-sonnet-5
    litellm_params:
      model: openai/mimo-v2.5-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_API_KEY
    model_info:
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.000010

  - model_name: claude-sonnet-5
    litellm_params:
      model: openai/hy3-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_API_KEY
    model_info:
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.000010

  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: nvidia_nim/openai/gpt-oss-120b
      api_key: os.environ/NVIDIA_API_KEY_1
    model_info:
      input_cost_per_token: 0.00000015
      output_cost_per_token: 0.0000006

  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: nvidia_nim/openai/gpt-oss-120b
      api_key: os.environ/NVIDIA_API_KEY_2
    model_info:
      input_cost_per_token: 0.00000015
      output_cost_per_token: 0.0000006

  - model_name: agnes-2.0-flash
    litellm_params:
      model: openai/agnes-2.0-flash
      api_base: https://apihub.agnes-ai.com/v1
      api_key: os.environ/AGNES_API_KEY
    model_info:
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000004

litellm_settings:
  drop_params: true
  use_chat_completions_url_for_anthropic_messages: true
  reasoning_auto_summary: true
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
  track_costs: true
  track_costs_by_model: true
  track_costs_by_key: true
  track_costs_by_user: true
  calculate_costs_for_streaming: true
  log_costs: true
  log_usage: true
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 90
  allowed_fails: 2
  cooldown_time: 30
  enable_pre_call_checks: true
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_password: os.environ/REDIS_PASSWORD
  cost_tracking_enabled: true
  cost_per_token:
    input_cost_per_token: 0.000001
    output_cost_per_token: 0.000004
  fallbacks:
    - claude-opus-4-8: ["claude-sonnet-5"]
    - claude-sonnet-5: ["claude-haiku-4-5-20251001"]
    - claude-haiku-4-5-20251001: ["agnes-2.0-flash"]
  context_window_fallbacks:
    - claude-opus-4-8: ["claude-sonnet-5"]
    - claude-sonnet-5: ["claude-haiku-4-5-20251001"]
    - claude-haiku-4-5-20251001: ["agnes-2.0-flash"]
