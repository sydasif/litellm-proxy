model_list:
  - model_name: gpt-oss-120b
    litellm_params:
      model: nvidia_nim/openai/gpt-oss-120b
      api_key: os.environ/NVIDIA_API_KEY_1

  - model_name: gpt-oss-120b
    litellm_params:
      model: nvidia_nim/openai/gpt-oss-120b
      api_key: os.environ/NVIDIA_API_KEY_2

  - model_name: nemotron-3-super
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-super-120b-a12b
      api_key: os.environ/NVIDIA_API_KEY_1

  - model_name: nemotron-3-super
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-super-120b-a12b
      api_key: os.environ/NVIDIA_API_KEY_2

  - model_name: mimo-v2.5
    litellm_params:
      model: openai/mimo-v2.5-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_API_KEY

  - model_name: agnes-2.0-flash
    litellm_params:
      model: openai/agnes-2.0-flash
      api_base: https://apihub.agnes-ai.com/v1
      api_key: os.environ/AGNES_API_KEY

litellm_settings:
  drop_params: true
  use_chat_completions_url_for_anthropic_messages: true
  fallbacks:
    [
      { "mimo-v2.5": ["agnes-2.0-flash"] },
      { "gpt-oss-120b": ["agnes-2.0-flash"] },
      { "nemotron-3-ultra": ["agnes-2.0-flash"] },
    ]

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 1
  timeout: 120
