model_list:
  - model_name: claude-opus-5
    litellm_params:
      model: openai/deepseek-v4-flash-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_API_KEY
      max_parallel_requests: 5
    rpm: 30
    model_info:
      input_cost_per_token: 0.00000050
      output_cost_per_token: 0.00000220

  - model_name: claude-opus-5
    litellm_params:
      model: openai/mimo-v2.5-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_API_KEY
      max_parallel_requests: 5
    rpm: 30
    model_info:
      input_cost_per_token: 0.00000050
      output_cost_per_token: 0.00000220

  - model_name: claude-sonnet-5
    litellm_params:
      model: openai/sensenova-6.8-flash-lite
      api_base: https://token.sensenova.ai/v1
      api_key: os.environ/SENSENOVA_API_KEY
      max_parallel_requests: 5
    rpm: 30
    model_info:
      input_cost_per_token: 0.00000014
      output_cost_per_token: 0.00000028

  - model_name: claude-sonnet-5
    litellm_params:
      model: openai/agnes-2.5-flash
      api_base: https://apihub.agnes-ai.com/v1
      api_key: os.environ/AGNES_API_KEY
      max_parallel_requests: 5
    rpm: 30
    model_info:
      input_cost_per_token: 0.00000014
      output_cost_per_token: 0.00000028

  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: nvidia_nim/openai/gpt-oss-120b
      api_key: os.environ/NVIDIA_API_KEY_1
      max_parallel_requests: 5
    rpm: 40
    model_info:
      input_cost_per_token: 0.00000003
      output_cost_per_token: 0.00000018

  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: nvidia_nim/openai/gpt-oss-120b
      api_key: os.environ/NVIDIA_API_KEY_2
      max_parallel_requests: 5
    rpm: 40
    model_info:
      input_cost_per_token: 0.00000003
      output_cost_per_token: 0.00000018

  - model_name: gemini-3.5
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY_1
      additional_drop_params: ["tools[*].strict"]
      max_parallel_requests: 5
    rpm: 15
    tpm: 240000
    model_info:
      input_cost_per_token: 0.00000003
      output_cost_per_token: 0.00000018

  - model_name: gemini-3.5
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY_2
      additional_drop_params: ["tools[*].strict"]
      max_parallel_requests: 5
    rpm: 15
    tpm: 240000
    model_info:
      input_cost_per_token: 0.00000003
      output_cost_per_token: 0.00000018

litellm_settings:
  drop_params: true
  use_chat_completions_url_for_anthropic_messages: true
  request_timeout: 120
  cache: true
  cache_params:
    type: local
    ttl: 600

router_settings:
  enable_weighted_failover: true
  optional_pre_call_checks:
    - enforce_model_rate_limits
  stream_timeout: 30
  cooldown_time: 60
  allowed_fails: 1
  num_retries: 2
  fallbacks:
    - claude-opus-5: ["claude-haiku-4-5-20251001"]
    - claude-sonnet-5: ["claude-haiku-4-5-20251001"]
    - claude-haiku-4-5-20251001: ["gemini-3.5"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
