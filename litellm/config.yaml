model_list:
  - model_name: claude-opus-5
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-super-120b-a12b
      api_key: os.environ/NVIDIA_API_KEY_1
      max_parallel_requests: 10
    rpm: 40

  - model_name: claude-sonnet-5
    litellm_params:
      model: openai/agnes-2.5-flash
      api_base: https://apihub.agnes-ai.com/v1
      api_key: os.environ/AGNES_API_KEY
      use_chat_completions_api: true
    rpm: 20

  - model_name: claude-sonnet-5
    litellm_params:
      model: openai/sensenova-6.8-flash-lite
      api_base: https://token.sensenova.ai/v1
      api_key: os.environ/SENSENOVA_API_KEY
      use_chat_completions_api: true
    rpm: 20

  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
      api_key: os.environ/NVIDIA_API_KEY_2
      max_parallel_requests: 10
    rpm: 40

  - model_name: gemini-3.5-flash-lite
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY_1
      additional_drop_params: ["tools[*].strict"]
    rpm: 15
    tpm: 250000

  - model_name: gemini-3.5-flash-lite
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY_2
      additional_drop_params: ["tools[*].strict"]
    rpm: 15
    tpm: 250000

  - model_name: gemini-3.1-flash-lite
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY_1
      additional_drop_params: ["tools[*].strict"]
    rpm: 15
    tpm: 250000

  - model_name: gemini-3.1-flash-lite
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY_2
      additional_drop_params: ["tools[*].strict"]
    rpm: 15
    tpm: 250000

litellm_settings:
  drop_params: true
  use_chat_completions_url_for_anthropic_messages: true
  request_timeout: 180

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2 # Retry twice before tripping fallback
  cooldown_time: 60 # Shorter cooldown for transient errors

  fallbacks:
    - claude-opus-5:
        ["gemini-3.5-flash-lite", "gemini-3.1-flash-lite"]
    - claude-sonnet-5:
        ["gemini-3.5-flash-lite", "gemini-3.1-flash-lite"]
    - claude-haiku-4-5-20251001:
        ["gemini-3.5-flash-lite", "gemini-3.1-flash-lite"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
