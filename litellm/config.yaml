# Original config.yaml content
model_list:
  - model_name: claude-opus-5-5
    litellm_params:
      model: nvidia_nim/mistralai/mistral-large-4-1t-a52b
      api_key: os.environ/NVIDIA_API_KEY_1
      rpm: 40
  - model_name: claude-opus-5-5
    litellm_params:
      model: nvidia_nim/mistralai/mistral-large-4-1t-a52b
      api_key: os.environ/NVIDIA_API_KEY_2
      rpm: 40

  - model_name: claude-sonnet-5
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
      api_key: os.environ/NVIDIA_API_KEY_1
      rpm: 40
  - model_name: claude-sonnet-5
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
      api_key: os.environ/NVIDIA_API_KEY_2
      rpm: 40

  - model_name: claude-haiku-5-5
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3.5-super-vl-120b-a12b
      api_key: os.environ/NVIDIA_API_KEY_1
      rpm: 40
  - model_name: claude-haiku-5-5
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3.5-super-vl-120b-a12b
      api_key: os.environ/NVIDIA_API_KEY_2
      rpm: 40

  - model_name: gemini-3.5-flash-lite
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY_1
      rpm: 15
      tpm: 250000
      additional_drop_params: ["tools[*].strict"]
  - model_name: gemini-3.5-flash-lite
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY_2
      rpm: 15
      tpm: 250000
      additional_drop_params: ["tools[*].strict"]

  - model_name: mistral-ministral
    litellm_params:
      model: mistral/ministral-3b-latest
      api_key: os.environ/MISTRAL_API_KEY
      rpm: 750
      tpm: 1300000
  - model_name: mistral-ministral
    litellm_params:
      model: mistral/ministral-8b-latest
      api_key: os.environ/MISTRAL_API_KEY
      rpm: 188
      tpm: 625000

  - model_name: sensenova-6.8-flash-lite
    litellm_params:
      model: openai/sensenova-6.8-flash-lite
      api_base: https://token.sensenova.ai/v1
      api_key: os.environ/SENSENOVA_API_KEY
      use_chat_completions_api: true
      rpm: 20

  - model_name: agnes-2.5-flash
    litellm_params:
      model: openai/agnes-2.5-flash
      api_base: https://apihub.agnes-ai.com/v1
      api_key: os.environ/AGNES_API_KEY
      use_chat_completions_api: true
      rpm: 10

  - model_name: qwen3.8-27b
    litellm_params:
      model: openai/Qwen3.8-27B
      api_base: https://developer.amd.com.cn/radeon/api/v1
      api_key: os.environ/AMD_API_KEY
      use_chat_completions_api: true
      rpm: 20

litellm_settings:
  drop_params: true
  use_chat_completions_url_for_anthropic_messages: true
  request_timeout: 90
  http2: True
  cache: True
  cache_params:
    type: local
    ttl: 300
    supported_call_types: []

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 1
  cooldown_time: 30
  optional_pre_call_checks: ["enforce_model_rate_limits"]

  fallbacks:
    - claude-opus-5-5: ["gemini-3.5-flash-lite", "sensenova-6.8-flash-lite", "agnes-2.5-flash"]
    - claude-sonnet-5: ["gemini-3.5-flash-lite", "sensenova-6.8-flash-lite", "agnes-2.5-flash"]
    - claude-haiku-5-5: ["gemini-3.5-flash-lite", "sensenova-6.8-flash-lite", "agnes-2.5-flash"]
    - agnes-2.5-flash: ["gemini-3.5-flash-lite", "sensenova-6.8-flash-lite"]
    - sensenova-6.8-flash-lite: ["gemini-3.5-flash-lite", "agnes-2.5-flash"]
    - gemini-3.5-flash-lite: ["sensenova-6.8-flash-lite", "agnes-2.5-flash"]
    - qwen3.8-27b: ["gemini-3.5-flash-lite", "sensenova-6.8-flash-lite", "agnes-2.5-flash"]
    - mistral-ministral: ["gemini-3.5-flash-lite", "sensenova-6.8-flash-lite", "agnes-2.5-flash"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
