model_list:
  - model_name: claude-opus-5
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-super-120b-a12b
      api_key: os.environ/NVIDIA_API_KEY_1

  - model_name: claude-sonnet-5
    litellm_params:
      model: openai/big-pickle
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_API_KEY

  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3.5-lightning-30b-a3b
      api_key: os.environ/NVIDIA_API_KEY_2

  - model_name: gemini-3.5
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY_1
      additional_drop_params: ["tools[*].strict"]
    rpm: 15
    tpm: 250000

  - model_name: gemini-3.5
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY_2
      additional_drop_params: ["tools[*].strict"]
    rpm: 15
    tpm: 250000

  - model_name: gemini-3.1
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY_1
      additional_drop_params: ["tools[*].strict"]
    rpm: 15
    tpm: 250000

  - model_name: gemini-3.1
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY_2
      additional_drop_params: ["tools[*].strict"]
    rpm: 15
    tpm: 250000

litellm_settings:
  drop_params: true
  use_chat_completions_url_for_anthropic_messages: true
  request_timeout: 120

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 1
  cooldown_time: 30
  fallbacks:
    - claude-opus-5: ["gemini-3.5"]
    - claude-sonnet-5: ["gemini-3.5"]
    - claude-haiku-4-5-20251001: ["gemini-3.1"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
