model_list:
  # ===== claude-opus-4-8 -> OpenCode mimo-v2.5-free (fast) =====
  - model_name: claude-opus-4-8
    litellm_params:
      model: openai/mimo-v2.5-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_API_KEY
    rpm: 30
    tpm: 100000
    model_info:
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.000010

  # ===== claude-opus-4-8 -> NVIDIA Nemotron 3 Ultra (reasoning) =====
  - model_name: claude-opus-4-8
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
      api_key: os.environ/NVIDIA_API_KEY_1
    rpm: 40
    tpm: 100000
    model_info:
      input_cost_per_token: 0.0000005
      output_cost_per_token: 0.0000022

  # ===== claude-sonnet-5 -> OpenCode hy3-free (295B MoE) =====
  - model_name: claude-sonnet-5
    litellm_params:
      model: openai/hy3-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_API_KEY
    rpm: 30
    tpm: 100000
    model_info:
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.000010

  # ===== claude-sonnet-5 -> NVIDIA Nemotron 4 340B (340B MoE peer, key 2) =====
  - model_name: claude-sonnet-5
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-4-340b-instruct
      api_key: os.environ/NVIDIA_API_KEY_2
    rpm: 40
    tpm: 100000
    model_info:
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000001

  # ===== claude-haiku-4-5-20251001 -> NVIDIA Mistral 7B (key 2, fastest) =====
  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: nvidia_nim/mistralai/mistral-7b-instruct-v0.3
      api_key: os.environ/NVIDIA_API_KEY_2
    rpm: 40
    tpm: 100000
    model_info:
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000004

  # ===== claude-haiku-4-5-20251001 -> NVIDIA Nemotron 3 Nano 30B (key 1, fast) =====
  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-nano-30b-a3b
      api_key: os.environ/NVIDIA_API_KEY_1
    rpm: 40
    tpm: 100000
    model_info:
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000004

  # ===== agnes-2.0-flash -> Agnes AI =====
  - model_name: agnes-2.0-flash
    litellm_params:
      model: openai/agnes-2.0-flash
      api_base: https://apihub.agnes-ai.com/v1
      api_key: os.environ/AGNES_API_KEY
    rpm: 20
    tpm: 100000
    model_info:
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000004

litellm_settings:
  drop_params: true
  use_chat_completions_url_for_anthropic_messages: true
  reasoning_auto_summary: true
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
  track_costs: true
  track_costs_by_model: true
  track_costs_by_key: true
  track_costs_by_user: true
  calculate_costs_for_streaming: true
  log_costs: true
  log_usage: true

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 90
  allowed_fails: 2
  cooldown_time: 30
  enable_pre_call_checks: true
  optional_pre_call_checks:
    - enforce_model_rate_limits
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_password: os.environ/REDIS_PASSWORD
  fallbacks:
    - claude-opus-4-8: ["claude-sonnet-5"]
    - claude-sonnet-5: ["claude-haiku-4-5-20251001"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
