      input_cost_per_token: 0.00000014
      output_cost_per_token: 0.00000028

  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY_1
      additional_drop_params: ["tools[*].strict"]
      order: 1
    rpm: 15
    tpm: 250000
    model_info:
      input_cost_per_token: 0.00000003
      output_cost_per_token: 0.00000018

  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY_2
      additional_drop_params: ["tools[*].strict"]
      order: 1
    rpm: 15
    tpm: 250000
    model_info:
      input_cost_per_token: 0.00000003
      output_cost_per_token: 0.00000018

  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY_1
      additional_drop_params: ["tools[*].strict"]
      order: 2
    rpm: 15
    tpm: 250000
    model_info:
      input_cost_per_token: 0.00000003
      output_cost_per_token: 0.00000018

  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY_2
      additional_drop_params: ["tools[*].strict"]
      order: 2
    rpm: 15
    tpm: 250000
    model_info:
      input_cost_per_token: 0.00000003
      output_cost_per_token: 0.00000018

  - model_name: agnes-2.0-flash
    litellm_params:
      model: openai/agnes-2.0-flash
      api_base: https://apihub.agnes-ai.com/v1
      api_key: os.environ/AGNES_API_KEY
      additional_drop_params: ["tools[*].strict"]
    model_info:
      input_cost_per_token: 0.00000016
      output_cost_per_token: 0.00000030

litellm_settings:
  drop_params: true
  use_chat_completions_url_for_anthropic_messages: true
  reasoning_auto_summary: true
  request_timeout: 120
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
    max_connections: 100
    ttl: 600

router_settings:
  enable_weighted_failover: true
  optional_pre_call_checks:
    - enforce_model_rate_limits
  fallbacks:
    - claude-opus-4-8: ["agnes-2.0-flash"]
    - claude-sonnet-5: ["agnes-2.0-flash"]
    - claude-haiku-4-5-20251001: ["claude-sonnet-5"]
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_password: os.environ/REDIS_PASSWORD

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
