services:
  litellm:
    image: docker.litellm.ai/berriai/litellm:main-stable
    container_name: litellm
    user: "1000:1000"
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/litellm/config.yaml:ro
    env_file:
      - ./.env
    command: ["--config", "/litellm/config.yaml"]
    restart: unless-stopped
