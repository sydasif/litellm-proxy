services:
  litellm:
    build:
      context: .
      dockerfile: Dockerfile
    image: litellm-proxy:patched
    container_name: litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    env_file:
      - ./.env
    command:
      [
        "--config",
        "/app/config.yaml",
        "--port",
        "4000",
      ]
    cpus: 1.5
    mem_limit: 2g
    stop_grace_period: 1m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 90s
      timeout: 10s
      retries: 2
      start_period: 30s

  searxng:
    container_name: core
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    restart: unless-stopped
    ports:
      - ${SEARXNG_HOST:+${SEARXNG_HOST}:}${SEARXNG_PORT:-8080}:${SEARXNG_PORT:-8080}
    env_file: ./.env
    volumes:
      - ./searxng/:/etc/searxng/:Z
      - core-data:/var/cache/searxng/

  valkey:
    container_name: valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - valkey-data:/data/

volumes:
  core-data:
  valkey-data:

networks:
  default:
    name: proxy-net
