services:
  litellm:
    build:
      context: .
      dockerfile: Dockerfile
    image: litellm-proxy:patched
    container_name: litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    env_file:
      - ./.env
    environment:
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY}"
    command:
      [
        "--config",
        "/app/config.yaml",
        "--port",
        "4000",
      ]
    cpus: 2.0
    mem_limit: 4g
    stop_grace_period: 1m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import requests; requests.get('http://localhost:4000/health/liveliness')"]
      interval: 90s
      timeout: 10s
      retries: 2
      start_period: 70s

networks:
  default:
    name: litellm-proxy-net
