services:
  litellm:
    build:
      context: .
      dockerfile: Dockerfile
    image: litellm-proxy:patched
    container_name: litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    env_file:
      - ./.env
    command:
      [
        "--config",
        "/app/config.yaml",
        "--port",
        "4000",
      ]
    cpus: 1.5
    mem_limit: 2g
    stop_grace_period: 1m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 90s
      timeout: 10s
      retries: 2
      start_period: 30s

networks:
  default:
    name: litellm-proxy-net
