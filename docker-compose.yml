services:
  litellm:
    build:
      context: .
      dockerfile: Dockerfile
    image: litellm-proxy:patched
    container_name: litellm
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    env_file:
      - ./.env
    command:
      ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    stop_grace_period: 1m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  default:
    name: proxy
