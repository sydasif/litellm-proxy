services:
  bifrost:
    image: maximhq/bifrost
    container_name: bifrost
    ports:
      - "4000:8080"
    volumes:
      - ./bifrost/config.json:/app/data/config.json:ro
    env_file:
      - ./.env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 10s
      timeout: 3s
      retries: 2
      start_period: 15s
    restart: unless-stopped
