services:
  litellm:
    build:
      context: .
      dockerfile: Dockerfile
    image: litellm-proxy:patched
    container_name: litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    env_file:
      - ./.env
    command:
      [
        "--config",
        "/app/config.yaml",
        "--host",
        "0.0.0.0",
        "--port",
        "4000",
        "--num_workers",
        "2"
      ]
    cpus: 1.5
    mem_limit: 2g
    stop_grace_period: 1m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"]
      interval: 30s        # 30s detects unresponsiveness faster than 90s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  default:
    name: proxy
